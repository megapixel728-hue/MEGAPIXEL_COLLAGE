<script>
/* Navegación independiente de las galerías. No modifica responsive.css. */
(() => {
  const grid = document.getElementById('worksGrid');
  if (!grid) return;
  const labels = {
    '15anos':'15 AÑOS', prenatal:'PRENATAL', babyshower:'BABY SHOWER',
    bautismo:'BAUTISMO', cumpleanosinfantiles:'CUMPLEAÑOS INFANTILES',
    cumpleanosadultos:'CUMPLEAÑOS ADULTOS', bodas:'BODAS', cumpleanos:'CUMPLEAÑOS'
  };
  const category = new URLSearchParams(location.search).get('categoria') || '15anos';
  const sections = [...grid.querySelectorAll('.work-category')];
  sections.forEach(section => { section.hidden = section.dataset.category !== category; });
  const title = document.getElementById('categoryTitle');
  if (title) title.textContent = labels[category] || 'NUESTROS TRABAJOS';
  const description = document.getElementById('categoryDescription');
  if (description) description.textContent = labels[category] ? 'Galería fotográfica de ' + labels[category].toLowerCase() + '.' : 'Selecciona una categoría del portafolio.';
  const lightbox = document.getElementById('photoLightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  grid.addEventListener('click', event => {
    const button = event.target.closest('.photo-only-item');
    if (!button || !lightbox || !lightboxImage) return;
    const img = button.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return;
    lightboxImage.src = img.src;
    lightboxImage.alt = img.alt || 'Fotografía ampliada';
    lightbox.hidden = false;
  });
  lightbox?.querySelector('.lightbox-close')?.addEventListener('click', () => {lightbox.hidden = true;});
  lightbox?.addEventListener('click', event => {if(event.target === lightbox) lightbox.hidden = true;});
  document.addEventListener('keydown', event => {if(event.key === 'Escape' && lightbox) lightbox.hidden = true;});
  grid.querySelectorAll('img').forEach(img => {
    img.addEventListener('error', () => { img.closest('.photo-only-item')?.setAttribute('hidden', ''); });
  });
})();
</script>
